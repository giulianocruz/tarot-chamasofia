name: Validate Tarot release

on:
  push:
    branches:
      - fix/tarot-conversion-consistency-20260829
  pull_request:
    branches:
      - codex/conversion-release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Normalize lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit normalized lockfile
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh lockfile after security upgrade"
            git push
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke local funnel
        env:
          PIX_KEY: smoke-test@chamasofia.invalid
          PIX_RECEIVER_NAME: CHAMA SOFIA
          PIX_RECEIVER_CITY: BOTUCATU
          BASE_URL: http://localhost:3000
        run: |
          npm run dev -- --port 3000 > /tmp/tarot-dev.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            echo "--- local server log ---"
            tail -n 200 /tmp/tarot-dev.log || true
          }
          trap cleanup EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3000/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:3000/ >/dev/null
          npm run smoke:funnel
