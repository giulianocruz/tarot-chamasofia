name: Jornada Sofia CI

on:
  push:
    branches:
      - feature/jornada-sofia-mvp-20260910
  pull_request:
    branches:
      - fix/astrology-precision-20260906

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
