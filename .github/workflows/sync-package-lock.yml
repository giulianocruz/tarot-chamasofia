name: Sync package lock

on:
  push:
    branches:
      - feature/tarot-ritual-premium-20261006

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tarot-ritual-premium-20261006
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sync package-lock.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package lock for astrology engine"
          git push origin HEAD:feature/tarot-ritual-premium-20261006
