name: Tarot hardening release CI

on:
  push:
    branches:
      - release/tarot-hardening-20260906
      - feature/tarot-ritual-premium-20261006

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
